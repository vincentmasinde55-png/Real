name: Replace Real with official Deriv Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Real
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download official Deriv Bot source
        run: |
          git clone --depth 1 --branch master https://github.com/deriv-com/bot.git /tmp/deriv-bot

      - name: Replace tracked application files
        run: |
          cp .github/workflows/build-official-deriv-bot.yml /tmp/build-official.yml
          cp .github/workflows/sync-deriv-bot.yml /tmp/old-sync.yml 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find /tmp/deriv-bot -mindepth 1 -maxdepth 1 ! -name .git -exec cp -R {} . \;
          mkdir -p .github/workflows
          cp /tmp/build-official.yml .github/workflows/build-official-deriv-bot.yml

      - name: Configure Vercel
        run: |
          cat > vercel.json <<'EOF'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "framework": null
          }
          EOF
          cat > VERCEL_ENV.md <<'EOF'
          # Vercel configuration for Real

          This application is built from the official Deriv Bot source. Do not replace its authentication or API configuration with a custom Next.js implementation.

          Configure the environment variables required by the checked-in Deriv Bot configuration in Vercel Project Settings → Environment Variables.

          Register the production callback/redirect URL for your deployed domain in the Deriv Developer Dashboard. Never commit access tokens, refresh tokens, client secrets, or private credentials.
          EOF

      - name: Commit official source into Real
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: use official Deriv Bot source [skip ci]"
          git push origin main
