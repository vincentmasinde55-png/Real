name: Import dbot-v2 into Real

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-dbot-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Real
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Danielandeche/dbot--v2
        run: git clone --depth 1 --branch master https://github.com/Danielandeche/dbot--v2.git /tmp/dbot-v2

      - name: Replace Real source with dbot-v2
        run: |
          cp .github/workflows/sync-deriv-bot.yml /tmp/sync-deriv-bot.yml
          rsync -a --delete --exclude='.git/' /tmp/dbot-v2/ ./
          mkdir -p .github/workflows
          cp /tmp/sync-deriv-bot.yml .github/workflows/sync-deriv-bot.yml

      - name: Configure Real branding and Vercel deployment
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('brand.config.json')
          if p.exists():
              data=json.loads(p.read_text())
              # Keep the template's full configuration; only replace obvious white-label identity fields.
              for k in ('brand_name','brandName','platform_name','platformName'):
                  if k in data and isinstance(data[k], str): data[k]='Real'
              for k in ('production_hostname','productionHostname','hostname'):
                  if k in data and isinstance(data[k], str): data[k]='real.vercel.app'
              p.write_text(json.dumps(data, indent=2)+'\n')
          PY
          cat > vercel.json <<'EOF'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "framework": null,
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF
          cat > VERCEL_ENV.md <<'EOF'
          # Real / dbot-v2 Vercel configuration

          Base application: Danielandeche/dbot--v2.

          Vercel:
          - Framework preset: Other
          - Build command: npm run build
          - Output directory: dist

          Configure the Deriv OAuth client ID and any other variables required by the checked-in `brand.config.json` / application configuration. The OAuth redirect URL registered in Deriv must exactly match the production URL used by Real.

          Never commit access tokens, refresh tokens, client secrets or other private credentials.
          EOF

      - name: Commit imported dbot-v2 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import Danielandeche dbot-v2 into Real [skip ci]"
          git push origin main
