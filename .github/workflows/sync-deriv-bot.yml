name: Build Real from official Deriv Bot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Real
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Deriv Bot source
        run: |
          git clone --depth 1 --branch master https://github.com/deriv-com/bot.git /tmp/deriv-bot
          rm -rf /tmp/deriv-bot/.git

      - name: Replace application with official Deriv Bot source
        run: |
          mkdir -p /tmp/real-preserve/.github/workflows
          cp .github/workflows/sync-deriv-bot.yml /tmp/real-preserve/sync-deriv-bot.yml
          rm -rf ./* ./.??* 2>/dev/null || true
          cp -R /tmp/deriv-bot/. .
          mkdir -p .github/workflows
          cp /tmp/real-preserve/sync-deriv-bot.yml .github/workflows/sync-deriv-bot.yml

      - name: Add Vercel deployment configuration
        run: |
          cat > vercel.json <<'EOF'
          {
            "buildCommand": "npm run build",
            "outputDirectory": "dist",
            "framework": null,
            "rewrites": [{ "source": "/(.*)", "destination": "/index.html" }]
          }
          EOF
          cat > VERCEL_ENV.md <<'EOF'
          # Real — Vercel setup

          This project is based on the official Deriv Bot source. The application contains the real dashboard, Bot Builder, Quick Strategy, Chart, Journal, Transactions, bot runtime and Deriv authentication architecture.

          ## Vercel

          Build command: `npm run build`
          Output directory: `dist`
          Framework preset: `Other`

          ## Environment variables

          The official Deriv Bot source has environment-specific configuration and authentication configuration in its source tree. Do not invent or rename variables. Configure the values required by the checked-in configuration for the production environment, especially the Deriv OAuth/OIDC client configuration and any API/analytics variables used by the build.

          Never commit access tokens, refresh tokens, client secrets or private credentials.
          EOF

      - name: Commit official Deriv Bot build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: rebuild Real from official Deriv Bot source [skip ci]"
          git push origin main
